spring:
  application:
    name: results-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prelude}
    username: ${SPRING_DATASOURCE_USERNAME:prelude}
    password: ${SPRING_DATASOURCE_PASSWORD:prelude}

  jpa:
    hibernate:
      # REPLACES the previous 'update': schema is owned by Flyway migrations only.
      # 'validate' fails startup if entities drift from the migrated schema.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

prelude:
  # Placeholder auth for held-out manifest mutation endpoints (see open questions).
  admin-token: ${PRELUDE_ADMIN_TOKEN:}

logging:
  level:
    org.flywaydb: INFO