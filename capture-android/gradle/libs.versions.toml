[versions]
# Central single source of truth; mirrored in docs/versions.md. Bump both together.
# Confirmed via orchestrator toolchain check (2026).
agp = "9.4.0"
kotlin = "2.4.0"
compileSdk = "37"      # Android 17
targetSdk = "37"       # kept in step with compileSdk (not specified in brief — flagged in summary)
minSdk = "31"          # Android 12 — required for batch-runner Thermal API (PowerManager thermal status, API 30+)

coreKtx = "1.15.0"
appcompat = "1.7.0"
material = "1.12.0"
coroutines = "1.9.0"
okhttp = "4.12.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }