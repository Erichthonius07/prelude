services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prelude}
      POSTGRES_USER: ${POSTGRES_USER:-prelude}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - prelude-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prelude} -d ${POSTGRES_DB:-prelude}"]
      interval: 5s
      timeout: 5s
      retries: 10

  results-service:
    build: ./results-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # FIX: previously hardcoded the DB name separately from POSTGRES_DB, so changing
      # one without the other silently broke the connection. Now derived from the same var.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-prelude}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-prelude}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PRELUDE_ADMIN_TOKEN: ${RESULTS_ADMIN_TOKEN:-}
    ports:
      - "8080:8080"

volumes:
  prelude-db-data: